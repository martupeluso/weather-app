<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatheria</title>
  </head>
  <body>
    <div class="header">
      <h1>Weatheria</h1>
      <form>
        <label for="location">Enter a location</label>

    </div>
    <div class="weather-data-container"></div>
  </body>
</html>
